name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.format }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            format: msi
            arch: x64
            recipe: package-msi
            artifact: desktop/release/*.msi
          - runner: macos-15-intel
            format: dmg
            arch: x64
            recipe: package-dmg
            artifact: desktop/release/*.dmg
          - runner: macos-15
            format: dmg
            arch: arm64
            recipe: package-dmg
            artifact: desktop/release/*.dmg
          - runner: ubuntu-24.04
            format: deb
            arch: x64
            recipe: package-deb
            artifact: desktop/release/*.deb
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true
      - uses: extractions/setup-just@v3
        with:
          just-version: "1.51.0"
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p 'require(`./desktop/package.json`).version')" = "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: just install
      - name: Download bundled CV models
        run: just models
      - name: Build ${{ matrix.format }} installer
        run: just ${{ matrix.recipe }}
      - uses: actions/upload-artifact@v7
        with:
          name: ailbum-${{ matrix.format }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "Ailbum $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
